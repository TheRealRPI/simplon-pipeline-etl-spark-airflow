name: tradecorp
services:
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: tradecorp_spark
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - "./notebooks:/home/jovyan/work"
      - "./data:/home/jovyan/data"
      - "./src:/home/jovyan/src"
      - "./tests:/home/jovyan/tests"
      - "./.env:/home/jovyan/.env"
      - "./log4j2.properties:/usr/local/spark/conf/log4j2.properties"
    environment:
      PYSPARK_SUBMIT_ARGS: "--packages org.apache.hadoop:hadoop-azure:3.3.4,org.postgresql:postgresql:42.7.0"
  postgres:
    image: postgres:16
    container_name: tradecorp_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tradecorp
    ports:
      - "5434:5432"
    volumes:
     - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tradecorp"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow:
    build: 
      context: .
      dockerfile: Dockerfile.airflow
    container_name: tradecorp_airflow
    ports: 
      - "8080:8080"
    volumes:
      - "./dags:/opt/airflow/dags"
      - "./src:/opt/airflow/src"
      - "./.env:/opt/airflow/.env"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./data/trigger:/opt/airflow/data/trigger"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres:5432/tradecorp
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin

volumes:
  pgdata:
    name: tradecorp_pgdata