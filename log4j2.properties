rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Désactiver les logs Spark au niveau INFO pour éviter le bruit
logger.spark.name = org.apache.spark
logger.spark.level = warn
logger.spark.additivity = false
logger.spark.appenderRef.stdout.ref = console

# Optionnel : faire taire des composants particulièrement bavards
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn

logger.spark_repl.name = org.apache.spark.repl.Main
logger.spark_repl.level = warn

# Logger pour les scripts Python personnalisés (dans src/)
logger.src.name = src
logger.src.level = info
logger.src.additivity = false
logger.src.appenderRef.stdout.ref = console